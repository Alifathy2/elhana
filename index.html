<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>El Hana IPTV</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <span id="tbClock"></span>
  <span id="tbSpeed"><span id="spDown">&#9660; —</span><span id="spUp">&#9650; —</span></span>
</div>

<!-- Add account (Xtream / M3U) -->
<section id="login" class="screen hidden">
  <button class="f btn small backbtn" id="btnBackLogin" data-i18n="back"></button>
  <div class="login-box">
    <img class="logo-big" src="logo.png" alt="El Hana IPTV">
    <div class="typesw">
      <button class="f opt on" data-ltype="xtream">Xtream Codes</button>
      <button class="f opt" data-ltype="m3u">M3U</button>
    </div>
    <input class="f" id="inName" data-i18n-ph="name_ph">
    <input class="f xt" id="inHost" data-i18n-ph="host_ph" dir="ltr">
    <input class="f xt" id="inUser" data-i18n-ph="user_ph" dir="ltr">
    <input class="f xt" id="inPass" data-i18n-ph="pass_ph" dir="ltr">
    <input class="f m3 hidden" id="inUrl" data-i18n-ph="m3u_ph" dir="ltr">
    <button class="f btn" id="btnLogin" data-i18n="addSignIn"></button>
    <p id="loginMsg" class="msg"></p>
    <p class="disc" data-i18n="disc"></p>
  </div>
  <button class="f btn small langbtn lang-login"></button>
</section>

<!-- Accounts list -->
<section id="accounts" class="screen hidden">
  <button class="f btn small backbtn" id="btnBackAcc" data-i18n="back"></button>
  <div class="acc-wrap">
    <h2 data-i18n="accountsT"></h2>
    <div id="accList"></div>
    <button class="f btn" id="btnAddAcc" data-i18n="addAcc"></button>
    <p id="accMsg" class="msg"></p>
  </div>
</section>

<!-- Home -->
<section id="home" class="screen hidden">
  <div class="home-top">
    <div class="brand"><img src="logo.png" alt=""><span>El Hana IPTV</span></div>
    <div class="acct"><div id="acctName"></div><div id="expiry" class="expiry"></div></div>
  </div>
  <div class="tiles">
    <button class="f tile t-live" data-type="live">
      <svg viewBox="0 0 64 64" width="150" height="150" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="14" width="52" height="34" rx="5"/><path d="M22 56h20M32 48v8M24 6l8 8 8-8"/><circle cx="32" cy="31" r="3" fill="#fff"/><path d="M24 23a11 11 0 0 0 0 16M40 23a11 11 0 0 1 0 16"/></svg>
      <span data-i18n="live"></span>
    </button>
    <button class="f tile t-movies" data-type="movies">
      <svg viewBox="0 0 64 64" width="150" height="150" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="24" width="52" height="32" rx="4"/><path d="M6 24l6-12 12 6-6 12M26 18l12 6-6-12 12 6 6 6M6 36h52"/><path d="M28 42l10 6-10 6z" fill="#fff"/></svg>
      <span data-i18n="movies"></span>
    </button>
    <button class="f tile t-series" data-type="series">
      <svg viewBox="0 0 64 64" width="150" height="150" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="18" width="44" height="34" rx="5"/><path d="M8 44V14a4 4 0 0 1 4-4h34"/><path d="M30 28l12 7-12 7z" fill="#fff"/></svg>
      <span data-i18n="series"></span>
    </button>
    <button class="f tile t-fav" data-type="fav">
      <svg viewBox="0 0 64 64" width="150" height="150" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 56S8 41 8 24a12 12 0 0 1 24-4 12 12 0 0 1 24 4c0 17-24 32-24 32z"/></svg>
      <span data-i18n="favorites"></span>
    </button>
  </div>
  <div class="home-bottom">
    <button class="f btn small" id="btnSettings" data-i18n="settings"></button>
    <button class="f btn small" id="btnLogout2" data-i18n="switchAcct"></button>
  </div>
</section>

<!-- Settings -->
<section id="settings" class="screen hidden">
  <button class="f btn small backbtn" id="btnBackSet" data-i18n="back"></button>
  <div class="set-wrap">
    <div id="setSecs" class="setsecs"></div>
    <div id="setPanel" class="setpanel"></div>
  </div>
</section>

<!-- Browse -->
<section id="main" class="screen hidden">
  <header>
    <nav id="tabs">
      <button class="f btn small" id="btnCats"></button>
      <button class="f tab" data-type="live" data-i18n="live"></button>
      <button class="f tab" data-type="movies" data-i18n="movies"></button>
      <button class="f tab" data-type="series" data-i18n="series"></button>
      <button class="f tab" data-type="fav">&#9829; <span data-i18n="favorites"></span></button>
    </nav>
    <div class="head-tools">
      <input class="f" id="search" data-i18n-ph="search_ph">
      <button class="f btn small" id="btnHome" data-i18n="home"></button>
    </div>
  </header>
  <div class="body">
    <aside id="cats"></aside>
    <main id="content">
      <div class="crumbrow"><div id="crumb" class="crumb"></div><div id="favhint" class="favhint" data-i18n="favHint"></div></div>
      <div id="grid"></div>
    </main>
  </div>
</section>

<!-- Details page -->
<section id="detail" class="screen hidden">
  <button class="f btn small backbtn" id="btnBackDet" data-i18n="back"></button>
  <div class="det">
    <div class="det-poster" id="detPoster"></div>
    <div class="det-info">
      <h1 id="detTitle"></h1>
      <div id="detMeta" class="det-meta"></div>
      <p id="detPlot" class="det-plot"></p>
      <div id="detExtra" class="det-extra"></div>
      <div class="det-btns">
        <button class="f btn" id="btnPlay"></button>
        <button class="f btn small" id="btnFav"></button>
        <button class="f btn small hidden" id="btnSeason"></button>
      </div>
    </div>
  </div>
  <div id="detEps" class="det-eps"></div>
</section>

<!-- Player -->
<section id="player" class="hidden">
  <video id="video" autoplay></video>
  <div id="osd" class="osd hidden">
    <div id="osdTitle"></div>
    <div class="vodonly"><div id="osdBar"><div id="osdFill"></div></div></div>
    <div id="osdTime"></div>
    <div class="pbar">
      <button class="f pb txt" data-act="back">&#8592; <span data-i18n="back"></span></button>
      <button class="f pb vodonly" data-act="rew" data-i18n-title="rew">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M11 6v12l-8.5-6zM21 6v12l-8.5-6z"/></svg><small>10</small></button>
      <button class="f pb" id="pbPlay" data-act="play"></button>
      <button class="f pb" data-act="stop" data-i18n-title="stop">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="f pb vodonly" data-act="fwd" data-i18n-title="fwd">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/></svg><small>30</small></button>
      <span class="sep"></span>
      <button class="f pb txt" data-act="quality" data-i18n="btnQuality"></button>
      <button class="f pb txt" data-act="audio" data-i18n="btnAudio"></button>
    </div>
  </div>
  <div id="pmenu" class="pmenu hidden"></div>
  <div id="playerMsg" class="player-msg hidden"></div>
</section>

<div id="ddmenu" class="pmenu dd hidden"></div>
<div id="loading" class="loading hidden" data-i18n="loading"></div>
<div id="toast" class="toast hidden"></div>

<!-- Exit confirmation (slides up) -->
<div id="exitdlg" class="modal hidden">
  <div class="modal-box">
    <div class="modal-t" data-i18n="exitQ"></div>
    <div class="modal-b">
      <button class="f btn small" id="btnExitNo" data-i18n="cancel"></button>
      <button class="f btn" id="btnExitYes" data-i18n="ok"></button>
    </div>
  </div>
</div>

<!-- Welcome / splash (3 seconds) -->
<div id="splash">
  <img src="logo.png" alt="El Hana IPTV">
  <div class="splash-name">El Hana IPTV</div>
</div>

<script src="ota.js"></script>
</body>
</html>
